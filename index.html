function tick(t){if(!playing)return;const dt=Math.max(0,Math.min(.1,(t-last)/1000));last=t;pos+=dt*8.4*mult;if(pos>=CP.length-1){pos=CP.length-1;playing=false;$('pb').textContent='▶ Replay';upd();return}upd();requestAnimationFrame(tick)}
$('pb').onclick=()=>{if(gps)stopGps();if(playing){playing=false;$('pb').textContent='▶ Play';return}if(pos>=CP.length-1)pos=0;playing=true;$('pb').textContent='❚❚ Pause';last=performance.now();map.setZoom(Math.max(map.getZoom(),16));requestAnimationFrame(tick)};
$('rb').onclick=()=>{playing=false;pos=0;said.clear();$('pb').textContent='▶ Play';upd();map.panTo(car.getLatLng())};
$('xb').onclick=()=>{mult=mult===1?2:mult===2?4:1;$('xb').textContent=mult+'×'};
$('rs').onchange=e=>{rid=e.target.value;setup()};
$('mb').onclick=()=>{$('sheet').classList.toggle('on');sheet()};
/* GPS drive mode */
function say(t,f){if(!voice&&!f)return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}
$('vb').onclick=()=>{voice=!voice;$('vb').textContent=voice?'🔊':'🔇';if(voice)say('Voice warnings on')};
function stopGps(){if(gps!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gps);gps=null;$('gb').classList.remove('p');$('gb').textContent='📍 GPS'}
$('gb').onclick=()=>{if(gps!=null){stopGps();return}if(!navigator.geolocation){$('sub').textContent='Location is not available in this browser.';return}
 playing=false;$('pb').textContent='▶ Play';$('gb').classList.add('p');$('gb').textContent='📍 GPS on';$('sub').textContent='Finding your location…';said.clear();
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
 gps=navigator.geolocation.watchPosition(fix,e=>{$('sub').textContent='Location error: '+e.message},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})};
function fix(f){const x=f.coords.longitude*KX,y=f.coords.latitude*KY;let b=1e18,bi=-1;const scan=(a,z)=>{for(let i=a;i<=z;i++){const d=(CP[i][0]*KX-x)**2+(CP[i][1]*KY-y)**2;if(d<b){b=d;bi=i}}};
 scan(Math.max(0,Math.floor(pos)-40),Math.min(CP.length-1,Math.floor(pos)+400));if(b>2500)scan(0,CP.length-1);const off=Math.sqrt(b);
 const kmh=f.coords.speed!=null?Math.round(f.coords.speed*3.6):null;
 if(off>60){car.setLatLng([f.coords.latitude,f.coords.longitude]);$('sub').textContent='Off route by about '+Math.round(off)+' m';return}
 pos=bi;upd();const lim=CS[bi];
 if(kmh!=null){$('sub').innerHTML='You: <b style="color:'+(lim&&kmh>lim+2?'#d92d20':'inherit')+'">'+kmh+' km/h</b>'+(lim&&kmh>lim+2?' · over the limit':'')}
 if(mt&&kmh!=null)mtSpd(bi,kmh);if(!mt)EV.forEach(e=>{const k=e.i+':'+e.tx;if(e.i>bi&&e.i-bi<=20&&!said.has(k)){said.add(k);say(e.tx)}})}
/* side sheet */
const MAN=[['Kerbside stop','Candidate: Victoria Rd near the centre (estimated, from a third-party route note).','Mirror, signal left, check the left blind spot, brake smoothly, stop parallel and close to the kerb, handbrake. Then mirror, blind spot and signal before moving off.'],['Three-point turn','Any quiet street with no calming devices (estimated).','Signal left and stop at the kerb. Check, steer right across to the far kerb, stop. Reverse back with full left lock, checking all around. Drive off.'],['Reverse parallel park','Any straight kerb with a gap (estimated).','Pull up beside the front car, reverse watching the rear and left, turn in at about 45°, straighten as the car lines up.'],['Hill start','Wherever there is a slope (not mapped).','Handbrake on, find the bite point, check mirrors and blind spot, release the handbrake as the engine note changes.'],['Roundabouts','Many on both routes (purple dots).','Slow, choose the lane by your exit, give way to traffic already in it, signal left on exit.']];
let qr=null,ql=null;
function quiz(){const c=D.runs.filter(r=>r.s);qr=c[Math.floor(Math.random()*c.length)];sheet()}
function showQ(){if(ql)map.removeLayer(ql);ql=L.polyline(qr.p.map(ll),{color:'#000',weight:9,opacity:.5,dashArray:'4 8'}).addTo(map);map.fitBounds(ql.getBounds(),{padding:[90,90],maxZoom:17})}
function ans(s){$('ar').innerHTML=(s===qr.s?'Correct. ':'Not quite. ')+'It is <b>'+qr.s+' km/h</b> ('+qr.t+' zone, TfNSW dataset). <button onclick="quiz();showQ()">Next</button>'}
function jump(i){playing=false;$('pb').textContent='▶ Play';pos=LS[i];upd();map.setView(car.getLatLng(),16)}
function sheet(){if(!$('sheet').classList.contains('on'))return;
 $('tabs').innerHTML=['steps','learn','about'].map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';sheet()">${{steps:'Steps',learn:'Learn',about:'About'}[t]}</button>`).join('');
 const legs=D.routes[rid].legs;let h='';
 if(tab==='steps')h=legs.map((g,i)=>`<div class="st ${i===lastLeg?'on':''}" onclick="jump(${i})"><span>${i+1}. ${g.road}</span><span style="color:${col(g.speed)};font-weight:700">${g.speed||'?'}</span></div>`).join('')+'<p class="note">Tap a step to jump there. The number is the dominant limit on that step. Legs marked below may follow a different stretch than the source route:</p><p class="note">'+(legs.filter(g=>g.gap).map(g=>g.road).join(', ')||'none')+'</p>';
 if(tab==='learn'){if(!qr)qr=D.runs.filter(r=>r.s)[0];const done=store.get('chk',{}),roads=[...new Set(legs.map(g=>g.road))];
  h=`<h3>Speed-limit quiz</h3><div><b>${qr.n}</b> <button onclick="showQ()">Show on map</button><div style="margin:8px 0;display:flex;gap:6px">${[40,50,60,70].map(s=>`<button onclick="ans(${s})">${s}</button>`).join('')}</div><div id="ar" class="note"></div></div><h3>Manoeuvres</h3>`+MAN.map(m=>`<details><summary><b>${m[0]}</b></summary><p class="note">${m[1]}</p><p>${m[2]}</p></details>`).join('')+'<h3>Quiet stretches to practise manoeuvres</h3><p class="note">Teal “P” dots on the map. Estimated from map data, not where an examiner will ask.</p>'+(D.man[rid]||[]).map((m,k)=>`<div class="st" onclick="map.setView([${m[2][1]},${m[2][0]}],18)"><span>${m[0]}</span><span class="note">${m[1]} m</span></div>`).join('')+'<h3>Practised roads</h3>'+roads.map(n=>`<label><input type="checkbox" ${done[n]?'checked':''} onchange="const c=store.get('chk',{});c['${n}']=this.checked;store.set('chk',c)"> ${n}</label>`).join('')}
 if(tab==='about')h=`<h3>Legend</h3>${[[40,'40 km/h (school / high-ped)'],[50,'50 km/h'],[60,'60 km/h'],[70,'70+ km/h'],[null,'Unverified']].map(a=>`<div><span class="sw" style="background:${col(a[0])}"></span>${a[1]}</div>`).join('')}<p class="note">Dots: blue lights, amber give way, red stop, teal crossing, purple roundabout.</p><h3>Read this</h3><p class="note">These are practice reconstructions of third-party routes, not official examiner routes. Limits come from the TfNSW Speed Zones dataset (last updated Oct 2024) and are not checked against signs. Hazards come from OpenStreetMap and are general learner risks, not known test-failure spots. Manoeuvre notes are general technique, not an official marking guide.</p><h3>GPS mode</h3><p class="note">GPS follows your real position along the route and shows your speed against the limit. Use it as a passenger, or set it up before you drive. Never handle the phone while driving.</p>`;
 $('body').innerHTML=h}
/* satellite toggle (needs a host that allows outside images) */
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});let te=0;
sat.on('tileerror',()=>{if(++te===6&&map.hasLayer(sat))$('sub').textContent='Satellite images could not load here. Host the file yourself to see them.'});
$('sat').onclick=()=>{if(map.hasLayer(sat)){map.removeLayer(sat);$('sat').classList.remove('p')}else{sat.addTo(map);$('sat').classList.add('p')}};
/* Street View link */
const GKEY='';/* optional: paste a Google Maps Embed API key here for the official Street View embed */
$('sv').onclick=()=>{const p=CP[Math.floor(pos)]||CP[0],hd=Math.round((HD+360)%360);
 const emb=GKEY?'https://www.google.com/maps/embed/v1/streetview?key='+GKEY+'&location='+p[1]+','+p[0]+'&heading='+hd+'&pitch=0&fov=90':'https://www.google.com/maps?q=&layer=c&cbll='+p[1]+','+p[0]+'&cbp=12,'+hd+',,0,0&source=embed&output=svembed';
 $('svx').href='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+p[1]+','+p[0]+'&heading='+hd+'&pitch=0&fov=90';$('svf').src=emb;$('svw').style.display='block';
 $('svn').textContent='Facing the direction of travel at the car\u2019s current position. If the window stays blank, use \u201cOpen in new tab\u201d.'};
$('svc').onclick=()=>{$('svw').style.display='none';$('svf').src='about:blank'};
/* ---- mock test: start routine, random manoeuvres, speed scoring ---- */
let mt=null;
const MREQ={'kerbside stop':['We will be doing a kerbside stop. Please pull over to the kerb and park the car. Secure it as if you were leaving it, and switch off the engine.','When you are ready, please restart the car and continue along the street.'],'three-point turn':['We will be doing a three-point turn. Please pull over to the kerb and stop.','When you are ready, please make a three-point turn without using any driveways, then continue along the street.'],'reverse parallel park':['We will be doing a reverse parallel park. Please park behind that parked car in a suitable position, and tell me when you have finished parking.','When you are ready, please continue along the street.']};
const VCHK=['Indicators and brake lights work','Tyres in good condition','Registration label displayed','Windscreen clear and mirrors undamaged','Seat belt and head restraint fitted for the examiner'];
const PREP=['Seat, mirrors and head restraint adjusted','Seat belt fastened, low and flat','Loose objects secured','Phone held by the passenger, not the driver'];
function nearIdx(p){let b=1e18,bi=0;CP.forEach((q,k)=>{const d=((q[0]-p[0])*KX)**2+((q[1]-p[1])*KY)**2;if(d<b){b=d;bi=k}});return bi}
function mkPlan(){const c=(D.man[rid]||[]).map(m=>({road:m[0],i:nearIdx(m[2])})).filter(x=>x.i>=100&&x.i<CP.length-120);
 for(let k=c.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[c[k],c[j]]=[c[j],c[k]]}
 const a=c[0],b=a&&(c.find(x=>x!==a&&Math.abs(x.i-a.i)>=120&&x.road!==a.road)||c.find(x=>x!==a&&Math.abs(x.i-a.i)>=120));if(!a||!b)return null;
 const second=Math.random()<.5?'three-point turn':'reverse parallel park';return[{t:'kerbside stop',...a},{t:second,...b}].sort((x,y)=>x.i-y.i)}
$('mk').onclick=()=>{playing=false;stopGps();$('pb').textContent='▶ Play';const p=mkPlan();if(!p){$('sub').textContent='Not enough quiet spots on this route for a mock test.';return}
 mt={plan:p,step:0,c:{},sp:[],state:'prep'};mtView()};
function mtView(){const m=$('mt'),box=(a,k)=>a.map((t,i)=>`<label><input type="checkbox" onchange="mt.c['${k}${i}']=this.checked" ${mt.c[k+i]?'checked':''}> ${t}</label>`).join('');
 const sec=mt.plan.find(p=>p.t!=='kerbside stop').t;let h='';
 if(mt.step===0)h=`<b>1. Vehicle check</b><p class="note">Tick each item as you check it, like the walk-around before a real test.</p>${box(VCHK,'v')}<div class="row"><button class="p" onclick="mt.step=1;mtView()">Next</button><button onclick="mtClose()">Cancel</button></div>`;
 if(mt.step===1)h=`<b>2. Briefing</b><p>This test has a <b>kerbside stop</b> and a <b>${sec}</b>. The spots are chosen at random from quiet stretches of this route and announced as you approach.</p><button onclick="say('We will be going for a short drive. I will tell you when to turn. We will be doing two manoeuvres, a kerbside stop and a ${sec}. If you have any questions, please ask now. Are you ready to commence driving?',true)">🔊 Hear briefing</button><div class="row"><button class="p" onclick="mt.step=2;mtView()">Next</button><button onclick="mt.step=0;mtView()">Back</button></div>`;
 if(mt.step===2)h=`<b>3. Ready to drive</b>${box(PREP,'p')}<p class="note"><b>Practice only.</b> NSW testing officers must be able to end a test if a device that records or tracks the car (including GPS) is running, so switch this app off for your real test.</p><div class="row"><button class="p" onclick="mtStart(1)">Start with GPS</button><button onclick="mtStart(0)">Start simulation</button><button onclick="mt.step=1;mtView()">Back</button></div>`;
 m.innerHTML=h;m.style.display='block'}
function mtStart(g){mt.state='run';mt.t0=Date.now();mt.sp=[];mt.act=null;voice=true;$('vb').textContent='🔊';$('wb').style.display='none';$('mt').style.display='none';said.clear();pos=0;mtBanner();upd();say('Please begin driving when you are ready.',true);if(g){if(gps!=null)stopGps();$('gb').onclick()}else $('pb').onclick()}
function mtBanner(){const a=mt.act;$('mbn').innerHTML=`<div class="w" style="background:#e5eefe"><b>🎓 Mock test running</b>${a?'<br>'+MREQ[a.t][a.part]+'<br><button onclick="mtNext()">'+(a.part?'Done':'Next instruction')+'</button>':'<br>Follow the examiner\u2019s instructions.'} <button onclick="mtEnd()">End test</button></div>`}
function mtNext(){const a=mt.act;if(!a)return;if(a.part===0){a.part=1;say(MREQ[a.t][1],true)}else{a.done=1;mt.act=null}mtBanner()}
function mtStep(i){if(!mt||mt.state!=='run')return;let ch=false;
 mt.plan.forEach(p=>{if(!p.on&&i>=p.i-30&&i<p.i+40){p.on=1;p.part=0;mt.act=p;say(MREQ[p.t][0],true);ch=true}if(mt.act===p&&i>=p.i+60){mt.act=null;ch=true}});
 if(ch)mtBanner();if(i>=CP.length-3)mtEnd()}
function mtSpd(i,k){if(mt&&mt.state==='run')mt.sp.push({k,l:CS[i],s:CT[i]==='School',r:D.routes[rid].legs[CL[i]].road})}
function mtEnd(){if(!mt||mt.state!=='run')return;mt.state='done';playing=false;stopGps();$('pb').textContent='▶ Play';$('wb').style.display='';$('mbn').innerHTML='';say('That is the end of the test.',true);
 const s=mt.sp.filter(x=>x.l),over=s.filter(x=>x.k>x.l+2),R={};over.forEach(x=>{const o=R[x.r]=R[x.r]||{m:0,l:x.l};o.m=Math.max(o.m,x.k-x.l)});
 const sch=s.filter(x=>x.s),slow=s.filter(x=>x.l>=60&&x.k>5&&x.k<x.l-20).length,mins=Math.max(1,Math.round((Date.now()-mt.t0)/60000));
 const rows=Object.entries(R).map(([r,o])=>`<div class="st"><span>${r}</span><span>up to +${o.m} km/h (${o.l} zone)</span></div>`).join('');
 const sp=s.length?`<p>${s.length} GPS readings matched a known limit. <b>${over.length}</b> were more than 2 km/h over.</p>${rows||'<p class="note">No overspeeding recorded.</p>'}${sch.length?'<p>School-zone segments: top speed '+Math.max(...sch.map(x=>x.k))+' km/h.</p>':''}${slow?'<p class="note">'+slow+' readings were more than 20 km/h under the limit on 60+ roads. The real test also looks at keeping up with traffic when conditions allow.</p>':''}`:'<p class="note">No GPS speed data. Speed scoring needs GPS mode, because the simulation has no real speed.</p>';
 const h=store.get('mt',[]);h.unshift({d:new Date().toISOString().slice(0,10),r:rid,o:over.length,n:s.length});store.set('mt',h.slice(0,10));
 $('mt').innerHTML=`<b>Mock test report</b><p class="note">${mins} min · ${mt.plan.map(p=>p.t+(p.done?' ✓':' (not marked done)')).join(', ')}</p><h3>Speed</h3>${sp}<p class="note">Practice feedback only, not an official score. GPS speed is an estimate and limits come from the TfNSW dataset.</p><div class="row"><button class="p" onclick="mtClose()">Close</button></div>`;$('mt').style.display='block'}
function mtClose(){$('mt').style.display='none';if(mt&&mt.state==='run')mtEnd();mt=null}
setup();
</script></body></html>
